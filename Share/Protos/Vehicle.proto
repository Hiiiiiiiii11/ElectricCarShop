syntax = "proto3";

option csharp_namespace = "GrpcService";

// Tin nhắn trống cho các yêu cầu "GetAll"
message GetAllVehicleRequest {
}
message GetAllVehicleInstanceRequest {
}
message GetAllVehiclePriceRequest {
}
message GetAllVehiclePromotionRequest {
}

service VehicleInstanceGrpcService {
  rpc GetVehicleInstanceById (GetVehicleInstanceByIdRequest) returns (VehicleInstanceReply);
  rpc GetVehicleById(GetVehicleByIdRequest) returns (VehicleReply);

  // === CẬP NHẬT CHO ETL ===

  // 1. Lấy tất cả các loại xe (Vehicle)
  rpc GetAllVehicles (GetAllVehicleRequest) returns (stream VehicleReply);
   rpc GetAllVehicleInstances (GetAllVehicleInstanceRequest) returns (stream VehicleInstanceReply);

  // 2. Lấy tất cả giá xe (từ hãng và đại lý)
  rpc GetAllVehiclePrices (GetAllVehiclePriceRequest) returns (stream VehiclePriceReply);

  // 3. Lấy tất cả khuyến mãi
  rpc GetAllVehiclePromotions (GetAllVehiclePromotionRequest) returns (stream VehiclePromotionReply);

  rpc GetAllocations (GetAllocationRequest) returns (stream AllocationReply);
}

// === Định nghĩa các Message Request ===

message GetVehicleInstanceByIdRequest {
  int32 id = 1;
}
message GetVehicleByIdRequest {
  int32 id = 1;
}
message GetAllocationRequest {
  int32 id = 1;

}

// === Định nghĩa các Message Reply ===

message AllocationReply {
  int32 id = 1;
  int32 agencyContractId = 2;
  int32 vehicleInstanceId = 3;
  string allocationDate = 4;
}
message VehicleInstanceReply {
  int32 id = 1;
  int32 vehicleId = 2;
  string vin = 3;
  string engineNumber = 4;
  string variantName = 5;
  string color = 6;
  string batteryCapacity = 7;
  int32 rangeKM = 8;
  string modelName = 9;
  string description = 10;
  string status = 11;
}

message VehicleReply {
  int32 id = 1;
  string variantName = 2;
  string color = 3;
  string batteryCapacity = 4;
  int32 rangeKM = 5;
  string modelName = 6;
  string description = 7;
  string features = 8; // Thêm features
}

// === Định nghĩa các Message Reply mới cho ETL ===

message VehiclePriceReply {
  int32 id = 1;
  int32 vehicleId = 2;
  // agencyId là optional, nếu không có là giá niêm yết của hãng
  oneof optionalAgencyId {
    int32 agencyId = 3;
  }
  string priceType = 4;
  double priceAmount = 5; // Dùng double cho tiền tệ trong gRPC
  string startDate = 6;
  string endDate = 7;
}

message VehiclePromotionReply {
  int32 id = 1;
  int32 vehicleId = 2;
  int32 agencyId = 3;
  string promoName = 4;
  double discountAmount = 5; // Dùng double
  string startDate = 6;
  string endDate = 7;
}