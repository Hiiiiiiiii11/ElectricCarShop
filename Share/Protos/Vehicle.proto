syntax = "proto3";

option csharp_namespace = "GrpcService";

// Định nghĩa service mới
service VehicleInstanceGrpcService {
  // RPC method để lấy thông tin vehicle instance bằng ID
  rpc GetVehicleInstanceById (GetVehicleInstanceByIdRequest) returns (VehicleInstanceReply);
}

// Message cho request
message GetVehicleInstanceByIdRequest {
  int32 id = 1;
}

// Message cho response, chứa toàn bộ thông tin cần thiết
message VehicleInstanceReply {
  // Thông tin từ VehicleInstance
  int32 id = 1;
  string vin = 2;
  string engineNumber = 3;

  // Thông tin từ Vehicles (thông số)
  string variantName = 5;
  string color = 6;
  string batteryCapacity = 7;
  int32 rangeKM = 8;
  
  // Thông tin từ VehicleOptions (dòng xe)
  string modelName = 9;
  string description = 10;
}