version: '3.9'

services:
  # ========================
  # NGINX Reverse Proxy
  # ========================
  nginx:
    image: nginx:latest
    container_name: electric_car_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/letsencrypt:ro
      - ./www:/var/www/certbot:ro
    depends_on:
      - userapi
      - agencyapi
      - allocationapi
      - orderapi
      - chatapi
      - notificationapi
    networks:
      - electric-car-network
      - backend

  # ========================
  # Certbot for SSL
  # ========================
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certs:/etc/letsencrypt
      - ./www:/var/www/certbot
    networks:
      - electric-car-network
      - backend

  # ========================
  # SQL Server Databases
  # ========================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Admin@2025!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - electric-car-network
      - backend

  # ========================
  # ElectricCar API Services
  # ========================
  userapi:
    build:
      context: .
      dockerfile: UserAPI/Dockerfile
    container_name: electric_car_userapi
    restart: unless-stopped
    depends_on:
      - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - "ConnectionStrings__UserDbConnection=Server=sqlserver;Database=UserDB;User Id=sa;Password=Admin@2025!;TrustServerCertificate=true;Encrypt=false"
    networks:
      - electric-car-network

  agencyapi:
    build:
      context: .
      dockerfile: DealerAPI/Dockerfile
    container_name: electric_car_agencyapi
    restart: unless-stopped
    depends_on:
      - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - "ConnectionStrings__AgencyDbConnection=Server=sqlserver;Database=AgencyDB;User Id=sa;Password=Admin@2025!;TrustServerCertificate=true;Encrypt=false"
    networks:
      - electric-car-network

  allocationapi:
    build:
      context: .
      dockerfile: AllocationAPI/Dockerfile
    container_name: electric_car_allocationapi
    restart: unless-stopped
    depends_on:
      - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - "ConnectionStrings__AllocationDbConnection=Server=sqlserver;Database=AllocationDB;User Id=sa;Password=Admin@2025!;TrustServerCertificate=true;Encrypt=false"
    networks:
      - electric-car-network

  orderapi:
    build:
      context: .
      dockerfile: OrderAPI/Dockerfile
    container_name: electric_car_orderapi
    restart: unless-stopped
    depends_on:
      - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - "ConnectionStrings__OrderDbConnection=Server=sqlserver;Database=OrderDB;User Id=sa;Password=Admin@2025!;TrustServerCertificate=true;Encrypt=false"
    networks:
      - electric-car-network

  # ========================
  # Chat & Notification Services
  # ========================
  chatapi:
    build:
      context: .
      dockerfile: UserChatAPI/Dockerfile
    container_name: chatapi
    restart: always
    depends_on:
      - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - "ConnectionStrings__ChatDbConnection=Server=sqlserver;Database=ChatDb;User Id=sa;Password=Admin@2025!;TrustServerCertificate=True;Encrypt=False;"
    networks:
      - backend

  notificationapi:
    build:
      context: .
      dockerfile: NotificationApi/Dockerfile
    container_name: notificationapi
    restart: always
    depends_on:
      - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - "ConnectionStrings__NotificationDbConnection=Server=sqlserver;Database=NotificationDb;User Id=sa;Password=Admin@2025!;TrustServerCertificate=True;Encrypt=False;"
    networks:
      - backend

volumes:
  sqlserver_data:

networks:
  electric-car-network:
    driver: bridge
  backend:
    driver: bridge
