version: '3.9'

services:
  nginx:
    image: nginx:latest
    container_name: electric_car_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/letsencrypt:ro
      - ./www:/var/www/certbot:ro
    depends_on:
      - userapi
      - agencyapi
      - allocationapi
      - orderapi
    networks:
      - electric-car-network

  certbot:
    image: certbot/certbot
    container_name: electric_car_certbot
    volumes:
      - ./certs:/etc/letsencrypt
      - ./www:/var/www/certbot

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: electric_car_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Admin@2025!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - electric-car-network
    restart: unless-stopped

  # ================= USER API =================
  userapi:
    build:
      context: .
      dockerfile: UserAPI/Dockerfile
    container_name: electric_car_userapi
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_Kestrel__Endpoints__Http__Url=http://+:5000
      - ASPNETCORE_Kestrel__Endpoints__Grpc__Url=http://+:5001
      - ASPNETCORE_Kestrel__Endpoints__Grpc__Protocols=Http2
      - "ConnectionStrings__UserDbConnection=Server=sqlserver;Database=UserDB;User Id=sa;Password=Admin@2025!;TrustServerCertificate=true;Encrypt=false"
    depends_on:
      - sqlserver
    expose:
      - "5000"
      - "5001"
    networks:
      - electric-car-network
    restart: unless-stopped

  # ================= AGENCY API =================
  agencyapi:
    build:
      context: .
      dockerfile: DealerAPI/Dockerfile
    container_name: electric_car_agencyapi
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_Kestrel__Endpoints__Http__Url=http://+:5000
      - ASPNETCORE_Kestrel__Endpoints__Grpc__Url=http://+:5001
      - ASPNETCORE_Kestrel__Endpoints__Grpc__Protocols=Http2
      - "ConnectionStrings__AgencyDbConnection=Server=sqlserver;Database=AgencyDB;User Id=sa;Password=Admin@2025!;TrustServerCertificate=true;Encrypt=false"
    depends_on:
      - sqlserver
    expose:
      - "5000"
      - "5001"
    networks:
      - electric-car-network
    restart: unless-stopped

  # ================= ALLOCATION API =================
  allocationapi:
    build:
      context: .
      dockerfile: AllocationAPI/Dockerfile
    container_name: electric_car_allocationapi
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_Kestrel__Endpoints__Http__Url=http://+:5000
      - ASPNETCORE_Kestrel__Endpoints__Grpc__Url=http://+:5001
      - ASPNETCORE_Kestrel__Endpoints__Grpc__Protocols=Http2
      - "ConnectionStrings__AllocationDbConnection=Server=sqlserver;Database=AllocationDB;User Id=sa;Password=Admin@2025!;TrustServerCertificate=true;Encrypt=false"
    depends_on:
      - sqlserver
    expose:
      - "5000"
      - "5001"
    networks:
      - electric-car-network
    restart: unless-stopped

  # ================= ORDER API =================
  orderapi:
    build:
      context: .
      dockerfile: OrderAPI/Dockerfile
    container_name: electric_car_orderapi
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_Kestrel__Endpoints__Http__Url=http://+:5000
      - ASPNETCORE_Kestrel__Endpoints__Grpc__Url=http://+:5001
      - ASPNETCORE_Kestrel__Endpoints__Grpc__Protocols=Http2
      - "ConnectionStrings__OrderDbConnection=Server=sqlserver;Database=OrderDB;User Id=sa;Password=Admin@2025!;TrustServerCertificate=true;Encrypt=false"
    depends_on:
      - sqlserver
    expose:
      - "5000"
      - "5001"
    networks:
      - electric-car-network
    restart: unless-stopped

volumes:
  sqlserver_data:

networks:
  electric-car-network:
    driver: bridge
