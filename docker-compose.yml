# =================================================================
# === FILE CẤU HÌNH DOCKER COMPOSE CHO ELECTRICCAR MANAGEMENT ===
# === PHIÊN BẢN HOÀN THIỆN - ĐÃ TẮT HEALTHCHECK ===
# =================================================================

services:
  # NGINX Reverse Proxy
  nginx:
    image: nginx:latest
    container_name: electric_car_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/letsencrypt:ro
      - ./www:/var/www/certbot:ro
    depends_on:
      - userapi
      - agencyapi
      - allocationapi
      - orderapi
    networks:
      - electric-car-network

  # Certbot for SSL
  certbot:
    image: certbot/certbot
    container_name: electric_car_certbot
    volumes:
      - ./certs:/etc/letsencrypt
      - ./www:/var/www/certbot

  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: electric_car_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Admin@2025!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - electric-car-network
    restart: unless-stopped
    # --- HEALTHCHECK ĐÃ ĐƯỢC XÓA ---

  # User API Service
  userapi:
    build:
      context: .
      dockerfile: UserAPIService/Dockerfile
    container_name: electric_car_userapi
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:80
      - "ConnectionStrings__UserDbConnection=Server=sqlserver;Database=UserDB;User Id=sa;Password=Admin@2025!;TrustServerCertificate=true;Encrypt=false"
    depends_on:
      sqlserver:
        condition: service_started # Đổi từ healthy sang started
    networks:
      - electric-car-network
    restart: unless-stopped

  # Agency API Service
  agencyapi:
    build:
      context: .
      dockerfile: AgencyAPIService/Dockerfile
    container_name: electric_car_agencyapi
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:80
      - "ConnectionStrings__AgencyDbConnection=Server=sqlserver;Database=AgencyDB;User Id=sa;Password=Admin@2025!;TrustServerCertificate=true;Encrypt=false"
      - "GrpcServices:AllocationApi=http://allocationapi"
      - "GrpcServices:UserApi=http://userapi"
    depends_on:
      sqlserver:
        condition: service_started # Đổi từ healthy sang started
    networks:
      - electric-car-network
    restart: unless-stopped

  # Allocation API Service
  allocationapi:
    build:
      context: .
      dockerfile: AllocationAPIService/Dockerfile
    container_name: electric_car_allocationapi
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:80
      - "ConnectionStrings__AllocationDbConnection=Server=sqlserver;Database=AllocationDB;User Id=sa;Password=Admin@2025!;TrustServerCertificate=true;Encrypt=false"
    depends_on:
      sqlserver:
        condition: service_started # Đổi từ healthy sang started
    networks:
      - electric-car-network
    restart: unless-stopped

  # Order API Service
  orderapi:
    build:
      context: .
      dockerfile: OrderAPIService/Dockerfile
    container_name: electric_car_orderapi
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:80
      - "ConnectionStrings__OrderDbConnection=Server=sqlserver;Database=OrderDB;User Id=sa;Password=Admin@2025!;TrustServerCertificate=true;Encrypt=false"
      - "GrpcServices:AgencyApi=http://agencyapi"
      - "GrpcServices:AllocationApi=http://allocationapi"
    depends_on:
      sqlserver:
        condition: service_started # Đổi từ healthy sang started
    networks:
      - electric-car-network
    restart: unless-stopped

volumes:
  sqlserver_data:

networks:
  electric-car-network:
    driver: bridge

