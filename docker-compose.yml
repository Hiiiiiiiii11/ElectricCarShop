# =================================================================
# === ELECTRICCAR MANAGEMENT - FINAL PRODUCTION DOCKER COMPOSE ===
# =================================================================

services:
  # ===================== NGINX Reverse Proxy =====================
  nginx:
    image: nginx:latest
    container_name: electric_car_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/letsencrypt:ro
      - ./www:/var/www/certbot:ro
    depends_on:
      - userapi
      - agencyapi
      - allocationapi
      - orderapi
    networks:
      - electric-car-network

  # ===================== CERTBOT for SSL =====================
  certbot:
    image: certbot/certbot
    container_name: electric_car_certbot
    volumes:
      - ./certs:/etc/letsencrypt
      - ./www:/var/www/certbot

  # ===================== SQL SERVER =====================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: electric_car_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Admin@2025!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - electric-car-network
    restart: unless-stopped

  # ===================== USER API =====================
  userapi:
    build:
      context: .
      dockerfile: UserAPIService/Dockerfile
    container_name: electric_car_userapi
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - "ConnectionStrings:UserDbConnection=Server=sqlserver;Database=UserDB;User Id=sa;Password=Admin@2025!;TrustServerCertificate=true;Encrypt=false"
    depends_on:
      sqlserver:
        condition: service_started
    networks:
      - electric-car-network
    restart: unless-stopped

  # ===================== AGENCY API =====================
  agencyapi:
    build:
      context: .
      dockerfile: AgencyAPIService/Dockerfile
    container_name: electric_car_agencyapi
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - "ConnectionStrings:AgencyDbConnection=Server=sqlserver;Database=AgencyDB;User Id=sa;Password=Admin@2025!;TrustServerCertificate=true;Encrypt=false"
      - "GrpcServices:UserApi=http://userapi"
      - "GrpcServices:AllocationApi=http://allocationapi"
      - "GrpcServices:OrderApi=http://orderapi"
    depends_on:
      sqlserver:
        condition: service_started
    networks:
      - electric-car-network
    restart: unless-stopped

  # ===================== ALLOCATION API =====================
  allocationapi:
    build:
      context: .
      dockerfile: AllocationAPIService/Dockerfile
    container_name: electric_car_allocationapi
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - "ConnectionStrings:AllocationDbConnection=Server=sqlserver;Database=AllocationDB;User Id=sa;Password=Admin@2025!;TrustServerCertificate=true;Encrypt=false"
      - "GrpcServices:AgencyApi=http://agencyapi"
    depends_on:
      sqlserver:
        condition: service_started
    networks:
      - electric-car-network
    restart: unless-stopped

  # ===================== ORDER API =====================
  orderapi:
    build:
      context: .
      dockerfile: OrderAPIService/Dockerfile
    container_name: electric_car_orderapi
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - "ConnectionStrings:OrderDbConnection=Server=sqlserver;Database=OrderDB;User Id=sa;Password=Admin@2025!;TrustServerCertificate=true;Encrypt=false"
      - "GrpcServices:UserApi=http://userapi"
      - "GrpcServices:AgencyApi=http://agencyapi"
      - "GrpcServices:AllocationApi=http://allocationapi"
    depends_on:
      sqlserver:
        condition: service_started
    networks:
      - electric-car-network
    restart: unless-stopped

# ===================== VOLUMES & NETWORKS =====================
volumes:
  sqlserver_data:

networks:
  electric-car-network:
    driver: bridge
