# Tên của workflow, sẽ hiển thị trong tab "Actions" trên GitHub
name: Deploy to EC2

# Điều kiện kích hoạt workflow: chạy khi có push lên nhánh 'main'
on:
  push:
    branches:
      - main

# Các công việc (jobs) sẽ được thực hiện
jobs:
  deploy:
    # Tên của job
    name: Deploy
    # Chạy trên một máy ảo Ubuntu mới nhất do GitHub cung cấp
    runs-on: ubuntu-latest

    # Các bước thực hiện
    steps:
      # Bước 1: Lấy mã nguồn từ repository về máy ảo runner
      - name: Checkout code
        uses: actions/checkout@v3

      # Bước 2: Thực thi các lệnh trên server EC2 của bạn qua SSH
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          # Các thông tin bí mật để kết nối SSH
          # Sẽ được cấu hình trong phần Settings của repo GitHub
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Script để chạy trên server EC2
          script: |
            # Đi vào thư mục dự án
            cd ~/ElectricCarShop
            
            # Tải về phiên bản code mới nhất từ nhánh main
            echo "🚚 Pulling latest code from main branch..."
            git pull origin main

            # Dừng và xóa các container cũ
            echo "🛑 Stopping and removing old containers..."
            docker-compose down

            # Dọn dẹp volume cũ của database để đảm bảo bắt đầu sạch
            echo "🧹 Removing old database volume..."
            docker volume rm electriccarshop_sqlserver_data || echo "Volume not found, skipping."

            # Build và khởi động tuần tự từng service
            echo "🚀 Starting sequential build and deployment..."
            
            echo "--- Starting Database ---"
            docker-compose up -d sqlserver
            
            echo "--- Building User API ---"
            docker-compose up --build -d userapi
            
            echo "--- Building Agency API ---"
            docker-compose up --build -d agencyapi
            
            echo "--- Building Allocation API ---"
            docker-compose up --build -d allocationapi
            
            echo "--- Building Order API ---"
            docker-compose up --build -d orderapi
            
            echo "--- Restarting NGINX with latest config ---"
            docker-compose up -d --force-recreate nginx
            
            # Dọn dẹp toàn bộ hệ thống Docker (container, network, image cũ) để tiết kiệm dung lượng
            echo "🧹 Pruning Docker system..."
            docker system prune -af
            
            echo "✅ Deployment successful!"

