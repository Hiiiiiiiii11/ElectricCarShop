# Tên của workflow
name: Deploy to EC2 (via Git Reset)

# Điều kiện kích hoạt
on:
  push:
    branches:
      - main

# Các công việc (jobs)
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      # Bước 1 và 2 (Checkout & SCP) đã bị loại bỏ
      
      - name: Pull code and Deploy on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # --- CÀI ĐẶT BIẾN ---
            # Đường dẫn SSH của repo bạn (lấy từ HTTPS bạn cung cấp)
            REPO_URL_SSH="git@github.com:Hiiiiiiiii11/ElectricCarShop.git"
            PROJECT_DIR="$HOME/ElectricCarShop"
            
            # ---------------------------------------------------
            # PHẦN 1: LẤY CODE MỚI NHẤT
            # ---------------------------------------------------
            echo "Navigating to project directory..."
            
            # Đi vào thư mục dự án. Nếu không tồn tại, báo lỗi.
            if ! cd $PROJECT_DIR; then
              echo "❌ Project directory $PROJECT_DIR not found. Please clone it manually first."
              exit 1
            fi

            echo "🔑 Adding GitHub.com's SSH key to known_hosts..."
            # Tạo thư mục .ssh nếu nó chưa tồn tại
            mkdir -p $HOME/.ssh
            # Lấy key của github.com và thêm vào known_hosts
            # Lệnh này sẽ ngăn lỗi "Host key verification failed"
            ssh-keyscan -t rsa github.com >> $HOME/.ssh/known_hosts
            
            echo "🔄 Ensuring remote URL is set to SSH..."
            # Lệnh này đảm bảo 'origin' dùng SSH, đề phòng bạn đã clone bằng HTTPS
            git remote set-url origin $REPO_URL_SSH
            
            echo "Fetching latest code from 'origin'..."
            git fetch origin
            
            echo "Resetting local 'main' branch to 'origin/main'..."
            # Lệnh này HỦY mọi thay đổi local và lấy 100% code từ 'main'
            git reset --hard origin/main

            echo "🔥 Deleting old 'bin' and 'obj' build folders..."
            find . -type d \( -name "bin" -o -name "obj" \) -exec rm -rf {} +
            
            # ---------------------------------------------------
            # PHẦN 2: DEPLOY DOCKER (Đã sửa cú pháp)
            # ---------------------------------------------------
            echo "🛑 Stopping and removing old containers..."
            docker-compose down

            echo "🔥🔥🔥 Forcibly removing old images (to fix corrupted cache)..."
            # Lệnh này tìm ID image của service và XÓA NÓ
            # '|| true' để script không bị lỗi nếu image không tồn tại
            docker rmi $(docker-compose images -q userapi) || true
            docker rmi $(docker-compose images -q agencyapi) || true
            docker rmi $(docker-compose images -q allocationapi) || true
            docker rmi $(docker-compose images -q orderapi) || true
            docker rmi $(docker-compose images -q analyticapi) || true
            docker rmi $(docker-compose images -q nginx) || true
            
            echo "🚀 Forcing REBUILD of all services (no-cache) and RECREATING containers..."
            
            echo "--- 1. Starting Database (build if needed) ---"
            docker-compose up --build -d sqlserver 
            
            echo "--- 2. Rebuilding User API ---"
            docker-compose build --no-cache userapi
            docker-compose up --force-recreate -d userapi
            
            echo "--- 3. Rebuilding Agency API ---"
            docker-compose build --no-cache agencyapi
            docker-compose up --force-recreate -d agencyapi
            
            echo "--- 4. Rebuilding Allocation API ---"
            docker-compose build --no-cache allocationapi
            docker-compose up --force-recreate -d allocationapi
            
            echo "--- 5. Rebuilding Order API ---"
            docker-compose build --no-cache orderapi
            docker-compose up --force-recreate -d orderapi

            echo "--- 6. Rebuilding Analytic API ---"
            docker-compose build --no-cache analyticapi
            docker-compose up --force-recreate -d analyticapi
            
            echo "--- 7. Rebuilding NGINX ---"
            docker-compose build --no-cache nginx
            docker-compose up --force-recreate -d nginx
            
            echo "🧹 Cleaning up old dangling images..."
            docker system prune -f
            
            echo "✅ Deployment successful!"