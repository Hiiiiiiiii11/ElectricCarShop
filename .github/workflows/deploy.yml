# Tên của workflow
name: Deploy to EC2

# Điều kiện kích hoạt
on:
  push:
    branches:
      - main

# Các công việc (jobs)
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Lấy mã nguồn về máy ảo runner
      - name: Checkout code
        uses: actions/checkout@v3

      # Bước 2: Đồng bộ file từ runner sang EC2
      - name: Sync repository files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./" # Sao chép toàn bộ thư mục hiện tại
          target: "~/ElectricCarShop" # Đến thư mục dự án trên EC2

      # Bước 3: Chạy các lệnh Docker trên EC2
      - name: Run deployment commands on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Đi vào thư mục dự án
            cd ~/ElectricCarShop
            
            echo "🛑 Stopping and removing old containers..."
            docker-compose down
            
            echo "🚀 Starting sequential build and deployment..."
            
            echo "--- Starting Database ---"
            docker-compose up -d sqlserver
            
            # ---------------------------------------------------
            # SỬA LỖI: Buộc build lại tất cả API (no-cache)
            # ---------------------------------------------------
            echo "--- Forcing rebuild of User API (no-cache) ---"
            docker-compose build --no-cache userapi
            docker-compose up -d userapi
            
            echo "--- Forcing rebuild of Agency API (no-cache) ---"
            docker-compose build --no-cache agencyapi
            docker-compose up -d agencyapi
            
            echo "--- Forcing rebuild of Allocation API (no-cache) ---"
            docker-compose build --no-cache allocationapi
            docker-compose up -d allocationapi
            
            echo "--- Forcing rebuild of Order API (no-cache) ---"
            docker-compose build --no-cache orderapi
            docker-compose up -d orderapi
            # ---------------------------------------------------

            echo "--- Restarting NGINX with latest config ---"
            docker-compose up -d nginx
            
            echo "🧹 Cleaning up old Docker images..."
            docker system prune -f
            
            echo "✅ Deployment successful!"